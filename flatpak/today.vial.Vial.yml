app-id: today.vial.Vial
runtime: org.kde.Platform
runtime-version: '5.15-23.08'
sdk: org.kde.Sdk
command: vial

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  # Access to all devices is required for USB HID communication with keyboards
  - --device=all

modules:
  - name: hidapi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # Disable libusb backend - not available in Flatpak SDK, hidraw backend is sufficient for keyboard HID
      - -DHIDAPI_WITH_LIBUSB=OFF
    sources:
      - type: archive
        url: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz
        sha256: a5714234abe6e1f53647dd8cba7d69f65f71c558b7896ed218864ffcf405bcbd

  - name: python3-hidapi
    buildsystem: simple
    build-commands:
      # Patch setup.py to remove exact Cython version requirement (SDK has Cython 0.29.37)
      - sed -i "s/setup_requires = \['Cython==0.29.25'\]/setup_requires = []/" setup.py
      # Build with --without-libusb to avoid needing libusb.h (hidraw backend is sufficient)
      - python3 setup.py install --without-libusb --prefix=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/vial-kb/cython-hidapi.git
        commit: fa31fd46e709ac4adba80bd516b1290dd56f43e9

  - python3-keyboard.json

  - python3-simpleeval.json

  - name: python3-future
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} future --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/da/71/ae30dadffc90b9006d77af76b393cb9dfbfc9629f339fc1574a1c52e6806/future-1.0.0-py3-none-any.whl
        sha256: 929292d34f5872e70396626ef385ec22355a1fae8ad29e1a734c3e43f9fbc216

  - name: python3-fbs
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "." --no-build-isolation
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/59/66/be644f4822992ade58e172b4d88d5292ad0a8ebbcd3be0079e8848b1f43d/fbs-1.2.7.tar.gz
        sha256: 5e988fdfe0b87317a04216d0eaba2fcf0b316ef14fe1b583459824673c1e0e05

  - name: vial
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/vial
      - cp -r src/main/python/* ${FLATPAK_DEST}/share/vial/
      - cp -r src/main/resources ${FLATPAK_DEST}/share/vial/
      - install -Dm644 src/main/icons/linux/256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/today.vial.Vial.png
      - install -Dm644 src/main/icons/linux/512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/today.vial.Vial.png
      - install -Dm644 flatpak/today.vial.Vial.desktop ${FLATPAK_DEST}/share/applications/today.vial.Vial.desktop
      - install -Dm644 flatpak/today.vial.Vial.metainfo.xml ${FLATPAK_DEST}/share/metainfo/today.vial.Vial.metainfo.xml
      - |
        cat > ${FLATPAK_DEST}/bin/vial << 'EOF'
        #!/bin/bash
        export PYTHONPATH="/app/share/vial:${PYTHONPATH}"
        cd /app/share/vial
        exec python3 /app/share/vial/main.py "$@"
        EOF
      - chmod +x ${FLATPAK_DEST}/bin/vial
    sources:
      - type: dir
        path: ..
